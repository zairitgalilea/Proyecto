<div class="contenedor-login">
  <div class="tarjeta-login">
    <h2 class="titulo-login">Iniciar Sesión</h2>
    
    <form class="formulario">
      <div class="grupo-input">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="ejemplo@correo.com">
      </div>

      <div class="grupo-input">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="********">
      </div>

      <button type="button" class="boton-entrar">Entrar</button>
    </form>

    <div class="opcion-registro">
      <p>¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </div>
  </div>
</div>
